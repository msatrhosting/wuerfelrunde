  :root{
    --bg:#f2e4c4; --card:#fffbf1; --border:#d6bd8c; --text:#3f2c1e;
    --muted:#8a7452; --accent:#a084b6; --accent-dark:#6a4a80; --accent-bg:#e3d3ee;
    --yellow:#e0ab2c; --yellow-light:#f6e1a3; --yellow-bg:#f8ecc4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{ touch-action:pan-y; }
  body{
    margin:0; font-family:'Handjet',sans-serif; font-weight:500;
    background:var(--bg); color:var(--text); padding-bottom:env(safe-area-inset-bottom);
    letter-spacing:0.02em; font-size:21px; overscroll-behavior-x:none;
  }
  .pixel-house{ width:0.82em; height:0.72em; vertical-align:baseline; margin-left:0.1em; }

  header{
    padding:14px 16px 10px; position:sticky; top:0; background:var(--bg); z-index:5;
    border-bottom:2px solid var(--menu-accent);
  }
  .header-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  h1{font-size:30px; font-weight:500; margin:0; color:var(--menu-accent); letter-spacing:0.04em; line-height:1; white-space:nowrap;}
  #headerbtnhost{ display:flex; gap:6px; align-items:center; }
  #headerbtnhost .header-btn{ margin:0 !important; font-size:14px; padding:6px 8px; }
  #shufflehost{ display:contents; }
  .header-btn{
    border:2px solid var(--accent); background:var(--card); color:var(--accent-dark); font-size:15px;
    padding:7px 12px; border-radius:10px; font-family:'Handjet',sans-serif; font-weight:500; white-space:nowrap;
  }

  /* setup screen */
  .setup{ padding:8px 16px 32px; }
  .setup-label{ font-size:22px; color:var(--accent-dark); margin:18px 0 8px; }
  .stepper{ display:flex; align-items:center; gap:14px; }
  .stepper button{
    width:44px; height:44px; border-radius:10px; border:2px solid var(--menu-accent); background:var(--card);
    color:var(--accent-dark); font-size:25px; font-family:'Handjet',sans-serif; font-weight:500;
  }
  .stepper .count{ font-size:30px; min-width:28px; text-align:center; color:var(--text); }
  .namelist{ display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .namerow{ display:flex; align-items:center; gap:10px; }
  .namerow .idx{ width:22px; color:var(--muted); font-size:18px; text-align:right; }
  .namerow input{
    flex:1; height:42px; border:2px solid var(--border); border-radius:8px; padding:0 10px;
    font-size:21px; font-family:'Handjet',sans-serif; font-weight:500; background:var(--card); color:var(--text);
  }
  .namerow input:focus{ outline:2px solid var(--accent-dark); border-color:var(--accent-dark); }

  .stylegrid{ display:flex; flex-direction:column; gap:10px; margin-top:8px; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:20px; }
  .toggle-label{ font-size:17px; color:var(--text); }
  .switch{ position:relative; display:inline-block; width:52px; height:30px; flex:0 0 auto; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .slider{
    position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0;
    background:var(--border); transition:background 200ms ease; border-radius:30px;
  }
  .switch .slider:before{
    position:absolute; content:""; height:22px; width:22px; left:4px; bottom:4px;
    background:var(--card); transition:transform 200ms ease; border-radius:50%;
  }
  .switch input:checked + .slider{ background:var(--menu-accent); }
  .switch input:checked + .slider:before{ transform:translateX(22px); }
  .styletile{
    display:flex; flex-direction:row; align-items:center; gap:12px; padding:12px 14px;
    border-radius:10px; border:2px solid var(--border); background:var(--card);
  }
  .styletile.active{ border-color:var(--sw-dark,var(--accent-dark)); background:var(--sw-bg,var(--accent-bg)); }
  .styletile .swatch{ width:40px; height:26px; flex:0 0 auto; }
  .styletile .stylabel{ font-size:14px; color:var(--text); text-align:center; }
  .startbtn{
    display:block; width:100%; margin-top:26px; height:50px; border-radius:12px; border:none;
    background:var(--menu-accent); color:#fff; font-size:24px; font-family:'Handjet',sans-serif; font-weight:500;
    letter-spacing:0.05em;
  }

  /* player nav */
  .playernav{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .navbtn{
    flex:0 0 auto; width:40px; height:40px; border-radius:10px; border:2px solid var(--accent);
    background:var(--card); color:var(--accent-dark); font-size:23px; font-family:'Handjet',sans-serif;
  }
  .navmid{ flex:1; text-align:center; overflow:hidden; }
  .navname{ font-size:26px; color:var(--accent-dark); transition:opacity 180ms ease; }
  .pixel-icon{ height:0.9em; width:auto; vertical-align:baseline; margin:0 0.14em; color:var(--accent-dark); }
  .navcount{ font-size:15px; color:var(--muted); }

  #slideHost{ position:relative; overflow:hidden; }
  .tablewrap{ overflow-x:auto; width:100%; }
  table{border-collapse:collapse; width:100%; min-width:100%;}
  th,td{padding:0; text-align:center;}
  .catcell{
    text-align:left; padding:10px 6px 10px 14px; font-size:22px;
    background:var(--card); border-right:2px solid var(--border);
    color:var(--text);
  }
  .hint{font-size:12px; color:var(--muted); display:block; letter-spacing:0;}
  tr{border-bottom:1px solid var(--border);}
  tr.section td, tr.section th{
    background:var(--accent-bg); font-weight:500; font-size:21px; padding:6px; color:var(--accent-dark);
  }
  tr.section .catcell{background:var(--accent-bg);}

  td.score{padding:6px 10px;}
  input.scoreinput, select.scoreinput{
    width:100%; height:46px; border:2px solid var(--border); border-radius:8px; text-align:center;

<script>
function multiples(n){
  const opts = [{value:'', label:'–'}, {value:'/', label:'/'}];
  for(let i=1;i<=5;i++) opts.push({value:String(n*i), label:String(n*i)});
  return opts;
}
function fixedOpts(points){
  return [
    {value:'', label:'–'},
    {value:String(points), label:points+' Pkt'},
    {value:'/', label:'/'},
  ];
}

const UPPER = [
  {key:'ones', label:'1ER', type:'multiple', n:1},
  {key:'twos', label:'2ER', type:'multiple', n:2},
  {key:'threes', label:'3ER', type:'multiple', n:3},
  {key:'fours', label:'4ER', type:'multiple', n:4},
  {key:'fives', label:'5ER', type:'multiple', n:5},
  {key:'sixes', label:'6ER', type:'multiple', n:6},
];
const LOWER = [

function id(){ return Math.random().toString(36).slice(2,9); }

let state = load() || {
  setupDone: false,
  currentIndex: 0,
  theme: 1,
  hideSums: true,
  multiKniffel: false,
  players: [ newPlayer(1), newPlayer(2) ]
};
if(!state.theme) state.theme = 1;
if(state.hideSums === undefined) state.hideSums = true;
if(state.multiKniffel === undefined) state.multiKniffel = false;
/* beim Aufruf immer zuerst der Home-Screen; ein beendetes Spiel wird zurückgesetzt */
state.setupDone = false;
state.currentIndex = 0;
if(state.players.length && isGameComplete()){
  state.players.forEach(p=>{ p.scores = {}; p.extraKniffelCount = 0; p.shuffleUsed = false; });
}

function setTheme(id){
  state.theme = id;
  save();
  applyTheme();
  renderSetup();
}

function numVal(v){ const n = Number(v); return isNaN(n) ? 0 : n; }
function fmt(n){ return n === 0 ? '-' : n; }
function upperSum(p){ return UPPER.reduce((s,c)=> s + numVal(p.scores[c.key]), 0); }
function bonus(p){ return upperSum(p) >= 63 ? 35 : 0; }
function lowerSum(p){ return LOWER.reduce((s,c)=> s + numVal(p.scores[c.key]), 0); }
function total(p){ return upperSum(p) + bonus(p) + lowerSum(p); }
function isFilled(p){ return ALL_KEYS.every(k=> p.scores[k] !== undefined && p.scores[k] !== ''); }
function isGameComplete(){ return state.players.every(isFilled); }

function activePlayer(){ return state.players[state.currentIndex]; }

let pendingAdvance = null;
function scheduleAdvance(){
  if(pendingAdvance) clearTimeout(pendingAdvance);
  pendingAdvance = setTimeout(()=>{
    pendingAdvance = null;
    if(isGameComplete()) showWinner(); else nextPlayer();
  }, 1000);
}

function goToPlayer(i, direction){
  const n = state.players.length;
  if(n <= 1) return;
  if(pendingAdvance){ clearTimeout(pendingAdvance); pendingAdvance = null; }
  state.currentIndex = ((i % n) + n) % n;
  save();
  updateNav();
  refreshShuffleBtn();
  slideTo(direction);
}
function nextPlayer(){ goToPlayer(state.currentIndex + 1, 1); }
function prevPlayer(){ goToPlayer(state.currentIndex - 1, -1); }

function setPlayerCount(n){
  n = Math.max(1, Math.min(8, n));
  const cur = state.players.length;
  if(n > cur){
    for(let i=cur; i<n; i++) state.players.push(newPlayer(i+1));
  } else if(n < cur){
    state.players = state.players.slice(0, n);
  }
  save(); renderSetup();
}

function startGame(){
  state.setupDone = true;
  state.currentIndex = 0;
  save(); render();
}
function backToSetup(){
  if(!confirm('Zurück zur SPIELER*INNEN-Auswahl? Alle Punkte werden gelöscht.')) return;
  state.players.forEach(p=> p.scores = {});
  state.players.forEach(p=> p.shuffleUsed = false);
  state.setupDone = false;
  state.currentIndex = 0;
  save(); render();
}
function newGameFromWinner(){
  state.players.forEach(p=> p.scores = {});
  state.players.forEach(p=> p.shuffleUsed = false);
  state.setupDone = false;
  state.currentIndex = 0;
  save(); render();
}

function spawnFireworkBurst(cx, cy, colors){
  const count = 22;
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2*i/count) + (Math.random()-0.5)*0.3;
    const dist = 55 + Math.random()*110;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;
    const p = document.createElement('div');
    p.className = 'firework-particle';
    p.style.left = cx+'px'; p.style.top = cy+'px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.transform = 'translate(0,0)';
    p.style.opacity = '1';
    document.body.appendChild(p);
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        p.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        p.style.opacity = '0';
      });
    });
    setTimeout(()=>{ if(p.parentNode) p.parentNode.removeChild(p); }, 950);
  }
}

function playKniffelAnimation(onDone){
  const overlay = document.createElement('div');
  overlay.className = 'kniffel-overlay';
  const text = document.createElement('div');
  text.className = 'kniffel-text';
  text.textContent = 'KNIFFEL!';
  overlay.appendChild(text);
  document.body.appendChild(overlay);

  requestAnimationFrame(()=>{
    overlay.classList.add('show');
    text.classList.add('play');
  });

  const vivid = ['#ea3a3a', '#ea8c3a', '#eae23a', '#3aea58', '#3aa1ea', '#773aea'];
  const w = window.innerWidth, h = window.innerHeight;
  const bursts = [
    {x:w*0.22, y:h*0.3, delay:0},
    {x:w*0.78, y:h*0.28, delay:220},
    {x:w*0.5,  y:h*0.5,  delay:480},
    {x:w*0.28, y:h*0.62, delay:720},
    {x:w*0.72, y:h*0.58, delay:920},
  ];
  bursts.forEach(b=> setTimeout(()=> spawnFireworkBurst(b.x, b.y, vivid), b.delay));

  setTimeout(()=>{
    overlay.classList.remove('show');
    text.style.transition = 'opacity 333ms ease';
    text.style.opacity = '0';
    setTimeout(()=>{
      if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if(onDone) onDone();
    }, 333);
  }, 1500);
}

function buildPodium(ranked, scoreFor){
  const heights = [150, 112, 80];
  let tierIndex = -1, lastScore = null;
  const withTier = ranked.map(p=>{
    const s = scoreFor(p);
    if(s !== lastScore){ tierIndex++; lastScore = s; }
    return {p, tier: tierIndex, score: s};
  });
  const podiumPlayers = withTier.filter(x=> x.tier < 3);
  const restPlayers = withTier.filter(x=> x.tier >= 3);

  const wrap = document.createElement('div');
  wrap.className = 'podium-wrap';

  const podium = document.createElement('div');
  podium.className = 'podium';
  podiumPlayers.forEach(x=>{
    const col = document.createElement('div');
    col.className = 'podium-col';
    const name = document.createElement('div');
    name.className = 'podium-names'; name.textContent = x.p.name;
    const step = document.createElement('div');
    step.className = 'podium-step'; step.style.height = heights[x.tier] + 'px';
    const rankLbl = document.createElement('div');
    rankLbl.className = 'podium-rank'; rankLbl.textContent = (x.tier+1) + '.';
    step.appendChild(rankLbl);
    const score = document.createElement('div');
    score.className = 'podium-score'; score.textContent = fmt(x.score);
    col.appendChild(name); col.appendChild(step); col.appendChild(score);
    podium.appendChild(col);
  });
  wrap.appendChild(podium);

  if(restPlayers.length){
    const rest = document.createElement('div');
    rest.className = 'leaderboard';
    restPlayers.forEach(x=>{
      const row = document.createElement('div');
      row.className = 'lb-row';
      const nm = document.createElement('span'); nm.textContent = x.p.name;
      const sc = document.createElement('span'); sc.textContent = fmt(x.score);
      row.appendChild(nm); row.appendChild(sc);
      rest.appendChild(row);
    });
    wrap.appendChild(rest);
  }
  return wrap;
}

function showWinner(){
  document.getElementById('navhost').innerHTML = '';
  document.getElementById('headerbtnhost').innerHTML = '';

  const footer = document.getElementById('footerhost');
  footer.innerHTML = '';
  const newBtn = document.createElement('button');
  newBtn.className = 'reset'; newBtn.textContent = 'Neues Spiel';
  newBtn.onclick = newGameFromWinner;
  footer.appendChild(newBtn);

  const communism = getTheme().communism;
  let scoreFor = total;
  if(communism){
    const n = state.players.length;
    const grand = state.players.reduce((s,p)=> s + total(p), 0);
    const share = Math.round(grand / n);
    scoreFor = ()=> share;
  }

  const ranked = [...state.players].sort((a,b)=> scoreFor(b) - scoreFor(a));
  const topScore = scoreFor(ranked[0]);
  const winners = ranked.filter(p=> scoreFor(p) === topScore);

  const main = document.getElementById('main');
  main.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'winner';

  wrap.innerHTML = CROWN_SVG
    + '<div class="winner-eyebrow">' + (winners.length > 1 ? 'SIEGER*INNEN' : 'SIEGER*IN') + '</div>'
    + '<div class="winner-name">'
      + '<span class="wn-icon">' + getTheme().iconLeft + '</span>'
      + winners.map(p=>'<span class="wn-name">'+p.name+'</span>').join('<span class="wn-sep">&</span>')
      + '<span class="wn-icon">' + getTheme().iconRight + '</span>'
    + '</div>'
    + '<div class="winner-score">' + topScore + ' Punkte</div>';

  wrap.appendChild(buildPodium(ranked, scoreFor));

  main.appendChild(wrap);
  spawnConfetti();
}

function catRow(cat){
  const p = activePlayer();
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.className = 'catcell';
  td.innerHTML = cat.label + (cat.hint ? '<span class="hint">'+cat.hint+'</span>' : '');
  tr.appendChild(td);

  const cell = document.createElement('td');
  cell.className = 'score';
  let ctrl;
  if(cat.type === 'number'){
    ctrl = document.createElement('input');
    ctrl.className = 'scoreinput';
    ctrl.type = 'text'; ctrl.inputMode = 'numeric'; ctrl.pattern = '[0-9/]*';
    ctrl.value = p.scores[cat.key] ?? '';
    if(p.scores[cat.key] !== undefined && p.scores[cat.key] !== '') ctrl.classList.add('filled');
    ctrl.addEventListener('input', ()=>{
      let v = ctrl.value.replace(/[^0-9/]/g,'');
      if(v === '0'){ v = '/'; ctrl.value = v; }
      p.scores[cat.key] = v === '' ? undefined : v;
      ctrl.classList.toggle('filled', v !== '');
      save(); refreshSums();
    });
    ctrl.addEventListener('change', ()=>{
      if(ctrl.value !== '') scheduleAdvance();
    });
  } else {
    ctrl = document.createElement('select');
    ctrl.className = 'scoreinput';
    const opts = cat.type === 'multiple' ? multiples(cat.n) : fixedOpts(cat.points);
    const current = p.scores[cat.key];
    opts.forEach(o=>{
      const opt = document.createElement('option');
      opt.value = o.value; opt.textContent = o.label;
      if((current ?? '') === o.value) opt.selected = true;
      ctrl.appendChild(opt);
    });
    if(current !== undefined && current !== '' && !opts.some(o=>o.value === current)){
      const extra = document.createElement('option');
      extra.value = current; extra.textContent = current; extra.selected = true;
      ctrl.appendChild(extra);
    }
    if(current !== undefined && current !== '') ctrl.classList.add('filled');
    ctrl.addEventListener('change', ()=>{
      p.scores[cat.key] = ctrl.value === '' ? undefined : ctrl.value;
      ctrl.classList.toggle('filled', ctrl.value !== '');
      save(); refreshSums();
      if(cat.key === 'kniffel' && ctrl.value === String(cat.points)){
        playKniffelAnimation(()=>{ if(ctrl.value !== '') scheduleAdvance(); });
      } else if(ctrl.value !== ''){
        scheduleAdvance();
      }
    });
  }
  cell.appendChild(ctrl);
  if(cat.key === 'kniffel'){
    const extraBtn = document.createElement('button');
    extraBtn.type = 'button';
    extraBtn.className = 'extra-kniffel-btn';
    extraBtn.textContent = 'Extra Kniffel';
    extraBtn.onclick = ()=> openExtraKniffelSelector(p);
    cell.appendChild(extraBtn);
  }
  tr.appendChild(cell);
  return tr;
}

  const tr = document.createElement('tr');

  const td = document.createElement('td');
  td.className = 'catcell'; td.textContent = label;

function validValues(cat){
  if(cat.type === 'number') return null; // any value
  return (cat.type === 'multiple' ? multiples(cat.n) : fixedOpts(cat.points)).map(o=>o.value).filter(v=>v!=='');
}
function shuffleScores(p){
  const keys = [...UPPER, ...LOWER].map(c=>c.key).filter(k=> p.scores[k] !== undefined && p.scores[k] !== '');
  if(!keys.length) return 'empty';
  const vals = keys.map(k=>p.scores[k]);
  if(keys.length < 2 || vals.every(v=>v===vals[0])) return 'none';
  let out;
  do { out = vals.slice().sort(()=>Math.random()-0.5); }
  while(out.every((v,i)=> v === vals[i]));
  keys.forEach((k,i)=>{ p.scores[k] = out[i]; });
  return 'ok';
}
function doShuffle(){
  const p = activePlayer();
  if(p.shuffleUsed) return;
  if(!confirm('Deine eingetragenen Punkte werden gemischt. Das geht nur einmal pro SPIELER*IN. Fortfahren?')) return;
  const res = shuffleScores(p);
  if(res === 'empty'){ alert('Du hast noch keine Punkte eingetragen.'); return; }
  if(res !== 'ok'){ alert('Mit diesen Punkten ist kein Mischen möglich.'); return; }
  p.shuffleUsed = true;
  save(); refreshShuffleBtn(); refreshTable();
}
function refreshShuffleBtn(){
  const host = document.getElementById('shufflehost');
  if(!host) return;
  host.innerHTML = '';
  if(!getTheme().rainbow || !state.setupDone) return;

  btn.className = 'header-btn'; btn.style.marginRight = '6px';
  btn.textContent = 'Shuffle';
  btn.disabled = !!p.shuffleUsed;
  if(p.shuffleUsed) btn.style.opacity = '0.45';
  btn.onclick = doShuffle;
  host.appendChild(btn);
}

function refreshTable(){

  host.innerHTML = '';

function openExtraKniffelSelector(p){
  const multi = state.multiKniffel;
  const eligible = [];

  if(multi){
    UPPER.forEach(cat=>{
      if(p.scores[cat.key] === undefined || p.scores[cat.key] === ''){
        eligible.push({key:cat.key, label:cat.label});
      }
    });
    LOWER.forEach(cat=>{
      if(cat.key !== 'kniffel' && (p.scores[cat.key] === undefined || p.scores[cat.key] === '')){
        eligible.push({key:cat.key, label:cat.label.replace(/<[^>]+>/g,'').trim()});
      }
    });
  } else {
    UPPER.forEach(cat=>{
      if(p.scores[cat.key] === undefined || p.scores[cat.key] === ''){
        eligible.push({key:cat.key, label:cat.label, value:cat.n*5});
      }
    });
    LOWER.forEach(cat=>{
      if(cat.type === 'fixed' && cat.key !== 'kniffel' && (p.scores[cat.key] === undefined || p.scores[cat.key] === '')){
        eligible.push({key:cat.key, label:cat.label.replace(/<[^>]+>/g,'').trim(), value:cat.points});
      }
    });
  }

  const bonusValue = 100 + (p.extraKniffelCount || 0) * 50;

  if(eligible.length === 0){
    return;
  }

  const overlay = document.createElement('div');
  overlay.className = 'ek-overlay';
  const card = document.createElement('div');
  card.className = 'ek-card';
  const title = document.createElement('div');
  title.className = 'ek-title';
  title.textContent = multi ? ('Extra Kniffel eintragen (+' + bonusValue + ')') : 'Extra Kniffel eintragen';
  card.appendChild(title);

  eligible.forEach(e=>{
    const val = multi ? bonusValue : e.value;
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'ek-option';
    btn.innerHTML = '<span>'+e.label+'</span><span>'+val+'</span>';
    btn.onclick = ()=>{
      p.scores[e.key] = String(val);
      p.extraKniffelCount = (p.extraKniffelCount || 0) + 1;
      save();
      if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
      refreshSums();
      refreshTable();
      scheduleAdvance();
    };
    card.appendChild(btn);
  });

  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button'; cancelBtn.className = 'ek-cancel'; cancelBtn.textContent = 'Abbrechen';
  cancelBtn.onclick = ()=>{ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); };
  card.appendChild(cancelBtn);

  overlay.appendChild(card);
  document.body.appendChild(overlay);
}

function refreshSums(){
  const p = activePlayer();
  const up = document.getElementById('sumUpper');
  const bo = document.getElementById('sumBonus');
  const lo = document.getElementById('sumLower');
  const to = document.getElementById('sumTotal');
  if(up) up.children[1].textContent = hideSum(upperSum, p);
  if(bo) bo.children[1].textContent = hideSum(bonus, p);
  if(lo) lo.children[1].textContent = hideSum(lowerSum, p);
  if(to) to.children[1].textContent = hideSum(total, p);
}

function buildTable(){
  const wrapDiv = document.createElement('div');
  wrapDiv.className = 'tablewrap';

  UPPER.forEach(cat=> tbody.appendChild(catRow(cat)));

  tbody.appendChild(sectionRow(''));

/* slide transition between players, plus swipe support */
function slideTo(direction){
  const host = document.getElementById('slideHost');
  if(!host) return;
  const existing = host.querySelectorAll('.tablewrap');
  for(let i=0; i<existing.length-1; i++){
    if(existing[i].parentNode) existing[i].parentNode.removeChild(existing[i]);
  }
  const oldEl = existing.length ? existing[existing.length-1] : null;
  const oldHeight = oldEl ? oldEl.offsetHeight : null;

  const newEl = buildTable();
  newEl.style.position = 'absolute';
  newEl.style.top = '0';
  newEl.style.left = '0';
  newEl.style.width = '100%';
  newEl.style.transform = 'translateX(' + (direction * 100) + '%)';
  host.appendChild(newEl);

  if(oldHeight !== null) host.style.height = oldHeight + 'px';
  const newHeight = newEl.scrollHeight;

  void newEl.offsetWidth;

  requestAnimationFrame(()=>{
    host.style.transition = 'height ' + TRANS_MS + 'ms ease-in-out';
    host.style.height = newHeight + 'px';
    if(oldEl){
      oldEl.style.transition = 'transform ' + TRANS_MS + 'ms ease-in-out';
      oldEl.style.transform = 'translateX(' + (-direction * 100) + '%)';
    }
    newEl.style.transition = 'transform ' + TRANS_MS + 'ms ease-in-out';
    newEl.style.transform = 'translateX(0)';
  });

  setTimeout(()=>{
    if(oldEl && oldEl.parentNode) oldEl.parentNode.removeChild(oldEl);
    newEl.style.position = 'static';
    newEl.style.transform = '';
    newEl.style.transition = '';
    host.style.height = '';
    host.style.transition = '';
  }, TRANS_MS + 40);
}

/* touch swipe to change player */
let touchStartX = 0, touchStartY = 0, touchTarget = null;
document.addEventListener('touchstart', function(e){
  if(!state.setupDone || state.players.length <= 1) return;
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
  touchTarget = e.target;
}, {passive:true});

document.addEventListener('touchend', function(e){
  if(!state.setupDone || state.players.length <= 1) return;
  if(touchTarget && (touchTarget.tagName === 'INPUT' || touchTarget.tagName === 'SELECT' || touchTarget.tagName === 'OPTION')) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4){
    if(dx < 0) nextPlayer(); else prevPlayer();
  }
}, {passive:true});

renderLegalLinks();
function render(){
  applyTheme();
  if(!state.setupDone){ renderSetup(); }
  else if(isGameComplete()){ renderGame(); showWinner(); }
  else { renderGame(); }
}

applyTheme();
render();
