<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kniffel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handjet:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2e4c4; --card:#fffbf1; --border:#d6bd8c; --text:#3f2c1e;
    --muted:#8a7452; --accent:#a084b6; --accent-dark:#6a4a80; --accent-bg:#e3d3ee;
    --yellow:#e0ab2c; --yellow-light:#f6e1a3; --yellow-bg:#f8ecc4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{ touch-action:pan-y; }
  body{
    margin:0; font-family:'Handjet',sans-serif; font-weight:500;
    background:var(--bg); color:var(--text); padding-bottom:env(safe-area-inset-bottom);
    letter-spacing:0.02em; font-size:21px; overscroll-behavior-x:none;
  }
  .pixel-house{ width:0.82em; height:0.72em; vertical-align:baseline; margin-left:0.1em; }

  header{
    padding:14px 16px 10px; position:sticky; top:0; background:var(--bg); z-index:5;
    border-bottom:2px solid var(--menu-accent);
  }
  .header-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  h1{font-size:34px; font-weight:500; margin:0; color:var(--menu-accent); letter-spacing:0.06em; line-height:1;}
  .header-btn{
    border:2px solid var(--accent); background:var(--card); color:var(--accent-dark); font-size:15px;
    padding:7px 12px; border-radius:10px; font-family:'Handjet',sans-serif; font-weight:500; white-space:nowrap;
  }

  /* setup screen */
  .setup{ padding:8px 16px 32px; }
  .setup-label{ font-size:22px; color:var(--accent-dark); margin:18px 0 8px; }
  .stepper{ display:flex; align-items:center; gap:14px; }
  .stepper button{
    width:44px; height:44px; border-radius:10px; border:2px solid var(--menu-accent); background:var(--card);
    color:var(--accent-dark); font-size:25px; font-family:'Handjet',sans-serif; font-weight:500;
  }
  .stepper .count{ font-size:30px; min-width:28px; text-align:center; color:var(--text); }
  .namelist{ display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .namerow{ display:flex; align-items:center; gap:10px; }
  .namerow .idx{ width:22px; color:var(--muted); font-size:18px; text-align:right; }
  .namerow input{
    flex:1; height:42px; border:2px solid var(--border); border-radius:8px; padding:0 10px;
    font-size:21px; font-family:'Handjet',sans-serif; font-weight:500; background:var(--card); color:var(--text);
  }
  .namerow input:focus{ outline:2px solid var(--accent-dark); border-color:var(--accent-dark); }

  .stylegrid{ display:flex; flex-direction:column; gap:10px; margin-top:8px; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:20px; }
  .toggle-label{ font-size:17px; color:var(--text); }
  .switch{ position:relative; display:inline-block; width:52px; height:30px; flex:0 0 auto; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .slider{
    position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0;
    background:var(--border); transition:background 200ms ease; border-radius:30px;
  }
  .switch .slider:before{
    position:absolute; content:""; height:22px; width:22px; left:4px; bottom:4px;
    background:var(--card); transition:transform 200ms ease; border-radius:50%;
  }
  .switch input:checked + .slider{ background:var(--menu-accent); }
  .switch input:checked + .slider:before{ transform:translateX(22px); }
  .styletile{
    display:flex; flex-direction:row; align-items:center; gap:12px; padding:12px 14px;
    border-radius:10px; border:2px solid var(--border); background:var(--card);
  }
  .styletile.active{ border-color:var(--sw-dark,var(--accent-dark)); background:var(--sw-bg,var(--accent-bg)); }
  .styletile .swatch{ width:40px; height:26px; flex:0 0 auto; }
  .styletile .stylabel{ font-size:14px; color:var(--text); text-align:center; }
  .startbtn{
    display:block; width:100%; margin-top:26px; height:50px; border-radius:12px; border:none;
    background:var(--menu-accent); color:#fff; font-size:24px; font-family:'Handjet',sans-serif; font-weight:500;
    letter-spacing:0.05em;
  }

  /* player nav */
  .playernav{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .navbtn{
    flex:0 0 auto; width:40px; height:40px; border-radius:10px; border:2px solid var(--accent);
    background:var(--card); color:var(--accent-dark); font-size:23px; font-family:'Handjet',sans-serif;
  }
  .navmid{ flex:1; text-align:center; overflow:hidden; }
  .navname{ font-size:26px; color:var(--accent-dark); transition:opacity 180ms ease; }
  .pixel-icon{ height:0.9em; width:auto; vertical-align:baseline; margin:0 0.14em; color:var(--accent-dark); }
  .navcount{ font-size:15px; color:var(--muted); }

  #slideHost{ position:relative; overflow:hidden; }
  .tablewrap{ overflow-x:auto; width:100%; }
  table{border-collapse:collapse; width:100%; min-width:100%;}
  th,td{padding:0; text-align:center;}
  .catcell{
    text-align:left; padding:10px 6px 10px 14px; font-size:22px;
    background:var(--card); border-right:2px solid var(--border);
    color:var(--text);
  }
  .hint{font-size:12px; color:var(--muted); display:block; letter-spacing:0;}
  tr{border-bottom:1px solid var(--border);}
  tr.section td, tr.section th{
    background:var(--accent-bg); font-weight:500; font-size:21px; padding:6px; color:var(--accent-dark);
  }
  tr.section .catcell{background:var(--accent-bg);}

  td.score{padding:6px 10px;}
  input.scoreinput, select.scoreinput{
    width:100%; height:46px; border:2px solid var(--border); border-radius:8px; text-align:center;
    font-size:23px; background:var(--card); color:var(--text); -moz-appearance:textfield;
    font-family:'Handjet',sans-serif; font-weight:500;
  }
  select.scoreinput{ padding:0 2px; text-align-last:center; appearance:none; -webkit-appearance:none; -moz-appearance:none; }
  input.scoreinput:focus, select.scoreinput:focus{outline:2px solid var(--accent-dark); border-color:var(--accent-dark);}
  .scoreinput.filled{background:var(--yellow-light); border-color:var(--yellow); font-weight:500; color:var(--accent-dark);}
  tr.bonusrow td, tr.bonusrow .catcell{background:var(--yellow-bg); color:var(--accent-dark);}
  tr.accentrow td, tr.accentrow .catcell{background:var(--accent-bg); color:var(--accent-dark);}
  tr.total td, tr.total th{padding:12px 6px; font-size:26px; font-weight:500;}
  tr.total .catcell{padding-left:18px;}
  tr.total{background:var(--accent);}
  tr.total .catcell{background:var(--accent); color:#fff; font-size:32px;}
  tr.total td{color:#fff;}

  .footer{padding:14px 16px 24px; text-align:center; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .reset{
    border:2px solid var(--accent); background:var(--card); color:var(--accent-dark); font-size:17px;
    padding:8px 14px; border-radius:10px; font-family:'Handjet',sans-serif; font-weight:500;
  }
  .empty{padding:24px 16px; color:var(--muted); font-size:18px; text-align:center;}

  /* winner screen */
  .winner{ padding:36px 20px 20px; text-align:center; }
  .crown{ width:108px; height:auto; margin:0 auto 8px; display:block; }
  .winner-eyebrow{ font-size:16px; color:var(--muted); letter-spacing:0.12em; }
  .winner-name{
    font-size:32px; color:var(--accent-dark); margin:4px 0; line-height:1.2;
    display:flex; flex-wrap:wrap; align-items:baseline; justify-content:center;
    gap:0 0.25em; row-gap:2px;
  }
  .winner-name .wn-sep{ margin:0 0.15em; }
  .winner-score{ font-size:22px; color:var(--text); margin-bottom:26px; }
  .leaderboard{ text-align:left; max-width:300px; margin:0 auto; border-radius:12px; overflow:hidden; border:2px solid var(--border); }
  .lb-row{ display:flex; justify-content:space-between; padding:10px 14px; background:var(--card); border-bottom:1px solid var(--border); font-size:21px; }
  .lb-row:last-child{ border-bottom:none; }
  .lb-row.win{ background:var(--accent-bg); color:var(--accent-dark); font-weight:500; }

  .podium-wrap{ margin-top:22px; }
  .podium{
    display:flex; align-items:flex-end; justify-content:center; gap:8px;
    max-width:340px; margin:0 auto; flex-wrap:wrap;
  }
  .podium-col{ display:flex; flex-direction:column; align-items:center; width:78px; }
  .podium-names{
    font-size:14px; color:var(--text); text-align:center; margin-bottom:6px; line-height:1.15;
    word-break:break-word;
  }
  .podium-step{
    width:100%; background:var(--accent); display:flex; align-items:flex-start;
    justify-content:center; padding-top:8px; box-sizing:border-box;
  }
  .podium-rank{ font-size:22px; color:#fff; font-weight:500; }
  .podium-score{ font-size:16px; color:var(--text); font-weight:500; margin-top:6px; }
  .podium-wrap .leaderboard{ margin-top:16px; }

  .extra-kniffel-btn{
    margin-top:6px; width:100%; height:32px; border-radius:8px; border:2px solid var(--accent);
    background:var(--accent-bg); color:var(--accent-dark); font-family:'Handjet',sans-serif;
    font-size:14px; font-weight:500;
  }
  .ek-overlay{
    position:fixed; inset:0; background:rgba(20,10,10,0.55); z-index:150;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .ek-card{
    background:var(--card); border-radius:14px; padding:20px; max-width:320px; width:100%;
    max-height:80vh; overflow-y:auto; border:2px solid var(--border);
  }
  .ek-title{ font-size:19px; color:var(--accent-dark); margin-bottom:14px; text-align:center; }
  .ek-option{
    display:flex; justify-content:space-between; width:100%; padding:12px 14px; margin-bottom:8px;
    border:2px solid var(--border); border-radius:10px; background:var(--card);
    font-family:'Handjet',sans-serif; font-size:18px; color:var(--text);
  }
  .ek-option:active{ background:var(--accent-bg); }
  .ek-cancel{
    display:block; width:100%; margin-top:4px; padding:10px; border:none; background:none;
    color:var(--muted); font-family:'Handjet',sans-serif; font-size:16px;
  }

  .confetti-piece{
    position:fixed; top:-14px; width:8px; height:14px; opacity:0.95; pointer-events:none;
    z-index:50; border-radius:2px; animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); }
    100%{ transform:translateY(112vh) rotate(420deg); }
  }

  .kniffel-overlay{
    position:fixed; inset:0; background:rgba(20,10,10,0); pointer-events:none; z-index:200;
    display:flex; align-items:center; justify-content:center;
    transition:background 300ms ease;
  }
  .kniffel-overlay.show{ background:rgba(15,8,8,0.78); }
  .kniffel-text{
    font-family:'Handjet',sans-serif; font-weight:500; font-size:64px; color:#fff;
    letter-spacing:0.06em; text-shadow:4px 4px 0 var(--accent-dark), -2px -2px 0 rgba(0,0,0,0.3);
    opacity:0;
  }
  .kniffel-text.play{ animation:kniffelWobble 1.5s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes kniffelWobble{
    0%{ transform:translateY(-120px) scale(0.6); opacity:0; }
    12%{ transform:translateY(18px) scale(1.08); opacity:1; }
    22%{ transform:translateY(-40px) scale(1); }
    32%{ transform:translateY(20px); }
    42%{ transform:translateY(-12px); }
    52%{ transform:translateY(8px); }
    62%{ transform:translateY(-5px); }
    72%{ transform:translateY(3px); }
    82%{ transform:translateY(-1px); }
    100%{ transform:translateY(0); opacity:1; }
  }
  .firework-particle{
    position:fixed; width:9px; height:9px; pointer-events:none; z-index:201;
    transition:transform 900ms cubic-bezier(0.15,0.6,0.4,1), opacity 900ms ease-out;
  }

  /* rainbow mode (Stil 6) */
  .rainbow-mode header{ border-bottom:2px solid transparent; border-image:linear-gradient(90deg,#ea3a3a 0.000%,#ea3a3a 3.333%,#ea553a 3.333%,#ea553a 6.667%,#ea713a 6.667%,#ea713a 10.000%,#ea8c3a 10.000%,#ea8c3a 13.333%,#eaa73a 13.333%,#eaa73a 16.667%,#eac33a 16.667%,#eac33a 20.000%,#eade3a 20.000%,#eade3a 23.333%,#dbea3a 23.333%,#dbea3a 26.667%,#c0ea3a 26.667%,#c0ea3a 30.000%,#a4ea3a 30.000%,#a4ea3a 33.333%,#89ea3a 33.333%,#89ea3a 36.667%,#6eea3a 36.667%,#6eea3a 40.000%,#52ea3a 40.000%,#52ea3a 43.333%,#3aea3d 43.333%,#3aea3d 46.667%,#3aea58 46.667%,#3aea58 50.000%,#3aea74 50.000%,#3aea74 53.333%,#3aea8f 53.333%,#3aea8f 56.667%,#3aeaaa 56.667%,#3aeaaa 60.000%,#3aeac6 60.000%,#3aeac6 63.333%,#3aeae1 63.333%,#3aeae1 66.667%,#3ad8ea 66.667%,#3ad8ea 70.000%,#3abdea 70.000%,#3abdea 73.333%,#3aa1ea 73.333%,#3aa1ea 76.667%,#3a86ea 76.667%,#3a86ea 80.000%,#3a6bea 80.000%,#3a6bea 83.333%,#3a4fea 83.333%,#3a4fea 86.667%,#403aea 86.667%,#403aea 90.000%,#5c3aea 90.000%,#5c3aea 93.333%,#773aea 93.333%,#773aea 96.667%,#923aea 96.667%,#923aea 100.000%) 1; }
  .rainbow-mode h1{ color:var(--text); }
  .rainbow-mode .setup-label{ color:var(--text); }
  .rainbow-mode .navname{ color:var(--text); }
  .rainbow-mode .startbtn, .rainbow-mode tr.total{
    background:linear-gradient(90deg,#ea3a3a 0.000%,#ea3a3a 3.333%,#ea553a 3.333%,#ea553a 6.667%,#ea713a 6.667%,#ea713a 10.000%,#ea8c3a 10.000%,#ea8c3a 13.333%,#eaa73a 13.333%,#eaa73a 16.667%,#eac33a 16.667%,#eac33a 20.000%,#eade3a 20.000%,#eade3a 23.333%,#dbea3a 23.333%,#dbea3a 26.667%,#c0ea3a 26.667%,#c0ea3a 30.000%,#a4ea3a 30.000%,#a4ea3a 33.333%,#89ea3a 33.333%,#89ea3a 36.667%,#6eea3a 36.667%,#6eea3a 40.000%,#52ea3a 40.000%,#52ea3a 43.333%,#3aea3d 43.333%,#3aea3d 46.667%,#3aea58 46.667%,#3aea58 50.000%,#3aea74 50.000%,#3aea74 53.333%,#3aea8f 53.333%,#3aea8f 56.667%,#3aeaaa 56.667%,#3aeaaa 60.000%,#3aeac6 60.000%,#3aeac6 63.333%,#3aeae1 63.333%,#3aeae1 66.667%,#3ad8ea 66.667%,#3ad8ea 70.000%,#3abdea 70.000%,#3abdea 73.333%,#3aa1ea 73.333%,#3aa1ea 76.667%,#3a86ea 76.667%,#3a86ea 80.000%,#3a6bea 80.000%,#3a6bea 83.333%,#3a4fea 83.333%,#3a4fea 86.667%,#403aea 86.667%,#403aea 90.000%,#5c3aea 90.000%,#5c3aea 93.333%,#773aea 93.333%,#773aea 96.667%,#923aea 96.667%,#923aea 100.000%) !important;
  }
  .rainbow-mode .namerow input:focus{
    outline:none; border:2px solid transparent;
    background:
      linear-gradient(var(--yellow-light),var(--yellow-light)) padding-box,
      linear-gradient(90deg,#f7a0a0 0.000%,#f7a0a0 3.333%,#f7aea0 3.333%,#f7aea0 6.667%,#f7bba0 6.667%,#f7bba0 10.000%,#f7c9a0 10.000%,#f7c9a0 13.333%,#f7d6a0 13.333%,#f7d6a0 16.667%,#f7e3a0 16.667%,#f7e3a0 20.000%,#f7f1a0 20.000%,#f7f1a0 23.333%,#eff7a0 23.333%,#eff7a0 26.667%,#e2f7a0 26.667%,#e2f7a0 30.000%,#d5f7a0 30.000%,#d5f7a0 33.333%,#c7f7a0 33.333%,#c7f7a0 36.667%,#baf7a0 36.667%,#baf7a0 40.000%,#acf7a0 40.000%,#acf7a0 43.333%,#a0f7a2 43.333%,#a0f7a2 46.667%,#a0f7af 46.667%,#a0f7af 50.000%,#a0f7bd 50.000%,#a0f7bd 53.333%,#a0f7ca 53.333%,#a0f7ca 56.667%,#a0f7d8 56.667%,#a0f7d8 60.000%,#a0f7e5 60.000%,#a0f7e5 63.333%,#a0f7f2 63.333%,#a0f7f2 66.667%,#a0eef7 66.667%,#a0eef7 70.000%,#a0e0f7 70.000%,#a0e0f7 73.333%,#a0d3f7 73.333%,#a0d3f7 76.667%,#a0c6f7 76.667%,#a0c6f7 80.000%,#a0b8f7 80.000%,#a0b8f7 83.333%,#a0abf7 83.333%,#a0abf7 86.667%,#a3a0f7 86.667%,#a3a0f7 90.000%,#b1a0f7 90.000%,#b1a0f7 93.333%,#bea0f7 93.333%,#bea0f7 96.667%,#cca0f7 96.667%,#cca0f7 100.000%) border-box;
  }
  .rainbow-mode tr.total .catcell{ background:transparent; }
  .rainbow-mode tr.accentrow td, .rainbow-mode tr.accentrow .catcell,
  .rainbow-mode tr.section td, .rainbow-mode tr.section .catcell{
    background:linear-gradient(90deg,#f7a0a0 0.000%,#f7a0a0 3.333%,#f7aea0 3.333%,#f7aea0 6.667%,#f7bba0 6.667%,#f7bba0 10.000%,#f7c9a0 10.000%,#f7c9a0 13.333%,#f7d6a0 13.333%,#f7d6a0 16.667%,#f7e3a0 16.667%,#f7e3a0 20.000%,#f7f1a0 20.000%,#f7f1a0 23.333%,#eff7a0 23.333%,#eff7a0 26.667%,#e2f7a0 26.667%,#e2f7a0 30.000%,#d5f7a0 30.000%,#d5f7a0 33.333%,#c7f7a0 33.333%,#c7f7a0 36.667%,#baf7a0 36.667%,#baf7a0 40.000%,#acf7a0 40.000%,#acf7a0 43.333%,#a0f7a2 43.333%,#a0f7a2 46.667%,#a0f7af 46.667%,#a0f7af 50.000%,#a0f7bd 50.000%,#a0f7bd 53.333%,#a0f7ca 53.333%,#a0f7ca 56.667%,#a0f7d8 56.667%,#a0f7d8 60.000%,#a0f7e5 60.000%,#a0f7e5 63.333%,#a0f7f2 63.333%,#a0f7f2 66.667%,#a0eef7 66.667%,#a0eef7 70.000%,#a0e0f7 70.000%,#a0e0f7 73.333%,#a0d3f7 73.333%,#a0d3f7 76.667%,#a0c6f7 76.667%,#a0c6f7 80.000%,#a0b8f7 80.000%,#a0b8f7 83.333%,#a0abf7 83.333%,#a0abf7 86.667%,#a3a0f7 86.667%,#a3a0f7 90.000%,#b1a0f7 90.000%,#b1a0f7 93.333%,#bea0f7 93.333%,#bea0f7 96.667%,#cca0f7 96.667%,#cca0f7 100.000%) !important;
    color:#5a4a30;
  }
  .rainbow-mode tr.total{ color:#fff; }

  /* Rot-Theme: gesamte Schrift auf Weiß für bessere Lesbarkeit */
  .communism-mode h1,
  .communism-mode .setup-label,
  .communism-mode .navname,
  .communism-mode .navcount,
  .communism-mode .catcell,
  .communism-mode .scoreinput,
  .communism-mode .namerow input,
  .communism-mode .stylabel,
  .communism-mode .lb-row,
  .communism-mode .winner-name,
  .communism-mode .winner-score,
  .communism-mode .winner-eyebrow,
  .communism-mode .podium-names,
  .communism-mode .podium-score,
  .communism-mode .startbtn,
  .communism-mode tr.total .catcell,
  .communism-mode tr.total td{
    color:#fff;
  }
  .communism-mode .catcell{ background:var(--accent-bg); }
  .communism-mode .scoreinput:not(.filled){ background:var(--accent-bg); }
  .communism-mode .scoreinput.filled{ background:var(--accent-bg); border-color:var(--accent-dark); color:#fff; }
  .communism-mode .namerow input{ background:var(--accent-bg); }
  .communism-mode tr.accentrow td, .communism-mode tr.accentrow .catcell,
  .communism-mode tr.bonusrow td, .communism-mode tr.bonusrow .catcell{
    background:var(--accent-dark); color:#fff;
  }
  .rainbow-mode .styletile.active{
    border:2px solid transparent;
    background:

];
function getTheme(){ return THEMES.find(t=>t.id === state.theme) || THEMES[0]; }
const DEFAULT_BG = '#f2e4c4';
function applyTheme(){
  const t = getTheme();
  const root = document.documentElement.style;
  root.setProperty('--accent', t.accent);
  root.setProperty('--accent-dark', t.accentDark);
  root.setProperty('--accent-bg', t.accentBg);
  root.setProperty('--menu-accent', t.menuAccent);
  root.setProperty('--menu-bg', t.menuBg);
  root.setProperty('--bg', (state.setupDone && t.communism) ? t.accentBg : DEFAULT_BG);
  document.body.classList.toggle('rainbow-mode', !!t.rainbow);
  document.body.classList.toggle('communism-mode', !!t.communism && state.setupDone);
}

function id(){ return Math.random().toString(36).slice(2,9); }
function newPlayer(n){ return {id:id(), name:'SPIELER*IN '+n, scores:{}}; }
function load(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){ return null; } }
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = load() || {
  setupDone: false,
  currentIndex: 0,
  theme: 1,
  hideSums: true,
  multiKniffel: false,
  players: [ newPlayer(1), newPlayer(2) ]
};
if(!state.theme) state.theme = 1;
if(state.hideSums === undefined) state.hideSums = true;
if(state.multiKniffel === undefined) state.multiKniffel = false;

function setTheme(id){
  state.theme = id;
  save();
  applyTheme();
  renderSetup();
}

function numVal(v){ const n = Number(v); return isNaN(n) ? 0 : n; }
function fmt(n){ return n === 0 ? '-' : n; }
function upperSum(p){ return UPPER.reduce((s,c)=> s + numVal(p.scores[c.key]), 0); }
function bonus(p){ return upperSum(p) >= 63 ? 35 : 0; }
function lowerSum(p){ return LOWER.reduce((s,c)=> s + numVal(p.scores[c.key]), 0); }
function total(p){ return upperSum(p) + bonus(p) + lowerSum(p); }
function isFilled(p){ return ALL_KEYS.every(k=> p.scores[k] !== undefined && p.scores[k] !== ''); }
function isGameComplete(){ return state.players.every(isFilled); }

function activePlayer(){ return state.players[state.currentIndex]; }

let pendingAdvance = null;
function scheduleAdvance(){
  if(pendingAdvance) clearTimeout(pendingAdvance);
  pendingAdvance = setTimeout(()=>{
    pendingAdvance = null;
    if(isGameComplete()) showWinner(); else nextPlayer();
  }, 1000);
}

function goToPlayer(i, direction){
  const n = state.players.length;
  if(n <= 1) return;
  if(pendingAdvance){ clearTimeout(pendingAdvance); pendingAdvance = null; }
  state.currentIndex = ((i % n) + n) % n;
  save();
  updateNav();
  slideTo(direction);
}
function nextPlayer(){ goToPlayer(state.currentIndex + 1, 1); }
function prevPlayer(){ goToPlayer(state.currentIndex - 1, -1); }

function setPlayerCount(n){
  n = Math.max(1, Math.min(8, n));
  const cur = state.players.length;
  if(n > cur){
    for(let i=cur; i<n; i++) state.players.push(newPlayer(i+1));
  } else if(n < cur){
    state.players = state.players.slice(0, n);
  }
  save(); renderSetup();
}

function startGame(){
  state.setupDone = true;
  state.currentIndex = 0;
  save(); render();
}
function backToSetup(){
  if(!confirm('Zurück zur SPIELER*INNEN-Auswahl? Alle Punkte werden gelöscht.')) return;
  state.players.forEach(p=> p.scores = {});
  state.setupDone = false;
  state.currentIndex = 0;
  save(); render();
}
function newGameFromWinner(){
  state.players.forEach(p=> p.scores = {});
  state.setupDone = false;
  state.currentIndex = 0;
  save(); render();
}

function spawnFireworkBurst(cx, cy, colors){
  const count = 22;
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2*i/count) + (Math.random()-0.5)*0.3;
    const dist = 55 + Math.random()*110;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;
    const p = document.createElement('div');
    p.className = 'firework-particle';
    p.style.left = cx+'px'; p.style.top = cy+'px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.transform = 'translate(0,0)';
    p.style.opacity = '1';
    document.body.appendChild(p);
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        p.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        p.style.opacity = '0';
      });
    });
    setTimeout(()=>{ if(p.parentNode) p.parentNode.removeChild(p); }, 950);
  }
}

function playKniffelAnimation(onDone){
  const overlay = document.createElement('div');
  overlay.className = 'kniffel-overlay';
  const text = document.createElement('div');
  text.className = 'kniffel-text';
  text.textContent = 'KNIFFEL!';
  overlay.appendChild(text);
  document.body.appendChild(overlay);

  requestAnimationFrame(()=>{
    overlay.classList.add('show');
    text.classList.add('play');
  });

  const vivid = ['#ea3a3a', '#ea8c3a', '#eae23a', '#3aea58', '#3aa1ea', '#773aea'];
  const w = window.innerWidth, h = window.innerHeight;
  const bursts = [
    {x:w*0.22, y:h*0.3, delay:0},
    {x:w*0.78, y:h*0.28, delay:220},
    {x:w*0.5,  y:h*0.5,  delay:480},
    {x:w*0.28, y:h*0.62, delay:720},
    {x:w*0.72, y:h*0.58, delay:920},
  ];
  bursts.forEach(b=> setTimeout(()=> spawnFireworkBurst(b.x, b.y, vivid), b.delay));

  setTimeout(()=>{
    overlay.classList.remove('show');
    text.style.transition = 'opacity 333ms ease';
    text.style.opacity = '0';
    setTimeout(()=>{
      if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if(onDone) onDone();
    }, 333);
  }, 1500);
}

function spawnConfetti(){

function buildPodium(ranked, scoreFor){
  const heights = [150, 112, 80];
  let tierIndex = -1, lastScore = null;
  const withTier = ranked.map(p=>{
    const s = scoreFor(p);
    if(s !== lastScore){ tierIndex++; lastScore = s; }
    return {p, tier: tierIndex, score: s};
  });
  const podiumPlayers = withTier.filter(x=> x.tier < 3);
  const restPlayers = withTier.filter(x=> x.tier >= 3);

  const wrap = document.createElement('div');
  wrap.className = 'podium-wrap';

  const podium = document.createElement('div');
  podium.className = 'podium';
  podiumPlayers.forEach(x=>{
    const col = document.createElement('div');
    col.className = 'podium-col';
    const name = document.createElement('div');
    name.className = 'podium-names'; name.textContent = x.p.name;
    const step = document.createElement('div');
    step.className = 'podium-step'; step.style.height = heights[x.tier] + 'px';
    const rankLbl = document.createElement('div');
    rankLbl.className = 'podium-rank'; rankLbl.textContent = (x.tier+1) + '.';
    step.appendChild(rankLbl);
    const score = document.createElement('div');
    score.className = 'podium-score'; score.textContent = fmt(x.score);
    col.appendChild(name); col.appendChild(step); col.appendChild(score);
    podium.appendChild(col);
  });
  wrap.appendChild(podium);

  if(restPlayers.length){
    const rest = document.createElement('div');
    rest.className = 'leaderboard';
    restPlayers.forEach(x=>{
      const row = document.createElement('div');
      row.className = 'lb-row';
      const nm = document.createElement('span'); nm.textContent = x.p.name;
      const sc = document.createElement('span'); sc.textContent = fmt(x.score);
      row.appendChild(nm); row.appendChild(sc);
      rest.appendChild(row);
    });
    wrap.appendChild(rest);
  }
  return wrap;
}

  const communism = getTheme().communism;
  let scoreFor = total;
  if(communism){
    const n = state.players.length;
    const grand = state.players.reduce((s,p)=> s + total(p), 0);
    const share = Math.round(grand / n);
    scoreFor = ()=> share;
  }

  const ranked = [...state.players].sort((a,b)=> scoreFor(b) - scoreFor(a));
  const topScore = scoreFor(ranked[0]);
  const winners = ranked.filter(p=> scoreFor(p) === topScore);

  const main = document.getElementById('main');
  main.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'winner';

  wrap.innerHTML = CROWN_SVG
    + '<div class="winner-eyebrow">' + (winners.length > 1 ? 'SIEGER*INNEN' : 'SIEGER*IN') + '</div>'
    + '<div class="winner-name">'

function catRow(cat){
  const p = activePlayer();
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.className = 'catcell';
  td.innerHTML = cat.label + (cat.hint ? '<span class="hint">'+cat.hint+'</span>' : '');
  tr.appendChild(td);

  const cell = document.createElement('td');
  cell.className = 'score';
  let ctrl;
  if(cat.type === 'number'){
    ctrl = document.createElement('input');
    ctrl.className = 'scoreinput';
    ctrl.type = 'text'; ctrl.inputMode = 'numeric'; ctrl.pattern = '[0-9/]*';
    ctrl.value = p.scores[cat.key] ?? '';
    if(p.scores[cat.key] !== undefined && p.scores[cat.key] !== '') ctrl.classList.add('filled');
    ctrl.addEventListener('input', ()=>{
      let v = ctrl.value.replace(/[^0-9/]/g,'');
      if(v === '0'){ v = '/'; ctrl.value = v; }
      p.scores[cat.key] = v === '' ? undefined : v;
      ctrl.classList.toggle('filled', v !== '');
      save(); refreshSums();
    });
    ctrl.addEventListener('change', ()=>{
      if(ctrl.value !== '') scheduleAdvance();
    });
  } else {
    ctrl = document.createElement('select');
    ctrl.className = 'scoreinput';
    const opts = cat.type === 'multiple' ? multiples(cat.n) : fixedOpts(cat.points);
    const current = p.scores[cat.key];
    opts.forEach(o=>{
      const opt = document.createElement('option');
      opt.value = o.value; opt.textContent = o.label;
      if((current ?? '') === o.value) opt.selected = true;
      ctrl.appendChild(opt);
    });
    if(current !== undefined && current !== '') ctrl.classList.add('filled');
    ctrl.addEventListener('change', ()=>{
      p.scores[cat.key] = ctrl.value === '' ? undefined : ctrl.value;
      ctrl.classList.toggle('filled', ctrl.value !== '');
      save(); refreshSums();
      if(cat.key === 'kniffel' && ctrl.value === String(cat.points)){
        playKniffelAnimation(()=>{ if(ctrl.value !== '') scheduleAdvance(); });
      } else if(ctrl.value !== ''){
        scheduleAdvance();
      }
    });
  }
  cell.appendChild(ctrl);
  if(cat.key === 'kniffel'){
    const extraBtn = document.createElement('button');
    extraBtn.type = 'button';
    extraBtn.className = 'extra-kniffel-btn';
    extraBtn.textContent = 'Extra Kniffel';
    extraBtn.onclick = ()=> openExtraKniffelSelector(p);
    cell.appendChild(extraBtn);
  }
  tr.appendChild(cell);
  return tr;
}

function openExtraKniffelSelector(p){
  const multi = state.multiKniffel;
  const eligible = [];

  if(multi){
    UPPER.forEach(cat=>{
      if(p.scores[cat.key] === undefined || p.scores[cat.key] === ''){
        eligible.push({key:cat.key, label:cat.label});
      }
    });
    LOWER.forEach(cat=>{
      if(cat.key !== 'kniffel' && (p.scores[cat.key] === undefined || p.scores[cat.key] === '')){
        eligible.push({key:cat.key, label:cat.label.replace(/<[^>]+>/g,'').trim()});
      }
    });
  } else {
    UPPER.forEach(cat=>{
      if(p.scores[cat.key] === undefined || p.scores[cat.key] === ''){
        eligible.push({key:cat.key, label:cat.label, value:cat.n*5});
      }
    });
    LOWER.forEach(cat=>{
      if(cat.type === 'fixed' && cat.key !== 'kniffel' && (p.scores[cat.key] === undefined || p.scores[cat.key] === '')){
        eligible.push({key:cat.key, label:cat.label.replace(/<[^>]+>/g,'').trim(), value:cat.points});
      }
    });
  }

  const bonusValue = 100 + (p.extraKniffelCount || 0) * 50;

  if(eligible.length === 0){
    return;
  }

  const overlay = document.createElement('div');
  overlay.className = 'ek-overlay';
  const card = document.createElement('div');
  card.className = 'ek-card';
  const title = document.createElement('div');
  title.className = 'ek-title';
  title.textContent = multi ? ('Extra Kniffel eintragen (+' + bonusValue + ')') : 'Extra Kniffel eintragen';
  card.appendChild(title);

  eligible.forEach(e=>{
    const val = multi ? bonusValue : e.value;
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'ek-option';
    btn.innerHTML = '<span>'+e.label+'</span><span>'+val+'</span>';
    btn.onclick = ()=>{
      p.scores[e.key] = String(val);
      p.extraKniffelCount = (p.extraKniffelCount || 0) + 1;
      save();
      if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
      refreshSums();
      refreshTable();
      scheduleAdvance();
    };
    card.appendChild(btn);
  });

  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button'; cancelBtn.className = 'ek-cancel'; cancelBtn.textContent = 'Abbrechen';
  cancelBtn.onclick = ()=>{ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); };
  card.appendChild(cancelBtn);

  overlay.appendChild(card);
  document.body.appendChild(overlay);
}

  main.innerHTML = '';
  const host = document.createElement('div');
  host.id = 'slideHost';
  host.appendChild(buildTable());
  main.appendChild(host);
}

/* slide transition between players, plus swipe support */
function slideTo(direction){
  const host = document.getElementById('slideHost');
  if(!host) return;
  const existing = host.querySelectorAll('.tablewrap');
  for(let i=0; i<existing.length-1; i++){
    if(existing[i].parentNode) existing[i].parentNode.removeChild(existing[i]);
  }
  const oldEl = existing.length ? existing[existing.length-1] : null;
  const oldHeight = oldEl ? oldEl.offsetHeight : null;

  const newEl = buildTable();
  newEl.style.position = 'absolute';
  newEl.style.top = '0';
  newEl.style.left = '0';
  newEl.style.width = '100%';
  newEl.style.transform = 'translateX(' + (direction * 100) + '%)';
  host.appendChild(newEl);

  if(oldHeight !== null) host.style.height = oldHeight + 'px';
  const newHeight = newEl.scrollHeight;

  void newEl.offsetWidth;

  requestAnimationFrame(()=>{
    host.style.transition = 'height ' + TRANS_MS + 'ms ease-in-out';
    host.style.height = newHeight + 'px';
    if(oldEl){
      oldEl.style.transition = 'transform ' + TRANS_MS + 'ms ease-in-out';
      oldEl.style.transform = 'translateX(' + (-direction * 100) + '%)';
    }
    newEl.style.transition = 'transform ' + TRANS_MS + 'ms ease-in-out';
    newEl.style.transform = 'translateX(0)';
  });

  setTimeout(()=>{
    if(oldEl && oldEl.parentNode) oldEl.parentNode.removeChild(oldEl);
    newEl.style.position = 'static';
    newEl.style.transform = '';
    newEl.style.transition = '';
    host.style.height = '';
    host.style.transition = '';
  }, TRANS_MS + 40);
}

/* touch swipe to change player */
let touchStartX = 0, touchStartY = 0, touchTarget = null;
document.addEventListener('touchstart', function(e){
  if(!state.setupDone || state.players.length <= 1) return;
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
  touchTarget = e.target;
}, {passive:true});

document.addEventListener('touchend', function(e){
  if(!state.setupDone || state.players.length <= 1) return;
  if(touchTarget && (touchTarget.tagName === 'INPUT' || touchTarget.tagName === 'SELECT' || touchTarget.tagName === 'OPTION')) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4){
    if(dx < 0) nextPlayer(); else prevPlayer();
  }
}, {passive:true});

function render(){
  applyTheme();
  if(!state.setupDone){ renderSetup(); }
  else if(isGameComplete()){ renderGame(); showWinner(); }
  else { renderGame(); }
}

applyTheme();
render();
</script>
